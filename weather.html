<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2b5876; --bg2:#4e4376; --ink:#fff; --soft:rgba(255,255,255,.14); }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2)); transition: background .8s; padding: 24px 16px 48px; }
  main { max-width: 760px; margin: 0 auto; }
  form { display: flex; gap: 8px; }
  input, button { font: inherit; color: inherit; border: 0; border-radius: 12px; padding: 12px 14px; background: var(--soft); }
  input { flex: 1; min-width: 0; } input::placeholder { color: rgba(255,255,255,.65); }
  button { cursor: pointer; } button:hover { background: rgba(255,255,255,.26); }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .hero { margin: 40px 0 28px; }
  .place { font-size: 1.2rem; font-weight: 500; }
  .temp { font-size: clamp(5rem, 22vw, 9rem); font-weight: 800; line-height: 1; letter-spacing: -.04em; }
  .cond { font-size: 1.4rem; font-weight: 300; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 28px; }
  .stat { background: var(--soft); border-radius: 14px; padding: 12px 14px; }
  .stat small { display: block; opacity: .75; } .stat b { font-size: 1.25rem; font-weight: 500; }
  h2 { font-size: 1rem; font-weight: 500; margin: 0 0 10px; opacity: .85; }
  .scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 28px; }
  .hour { flex: 0 0 auto; text-align: center; background: var(--soft); border-radius: 14px; padding: 10px 14px; min-width: 74px; }
  .hour span { display: block; font-size: 1.5rem; }
  .day { display: grid; grid-template-columns: 1fr auto 5.5rem; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  .day .ico { font-size: 1.4rem; } .day .rng { text-align: right; }
  .msg { margin: 24px 0; opacity: .85; }
  .foot { margin-top: 24px; font-size: .8rem; opacity: .7; }
</style>
</head>
<body>
<main>
  <form id="f">
    <input id="q" placeholder="Search a city" aria-label="City name" autocomplete="off">
    <button type="submit">Search</button>
    <button type="button" id="loc" title="Use my location">My location</button>
    <button type="button" id="unit" title="Switch units">°C</button>
  </form>
  <p class="msg" id="msg">Search a city or use your location.</p>
  <div id="app" hidden>
    <section class="hero">
      <div class="place" id="place"></div>
      <div class="temp" id="temp"></div>
      <div class="cond" id="cond"></div>
    </section>
    <section class="stats" id="stats"></section>
    <h2>Next 24 hours</h2>
    <section class="scroll" id="hours"></section>
    <h2>7-day forecast</h2>
    <section id="days"></section>
    <p class="foot" id="foot"></p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const WMO = {0:['Clear sky','☀️','🌙'],1:['Mostly clear','🌤️','🌙'],2:['Partly cloudy','⛅','☁️'],3:['Overcast','☁️','☁️'],
  45:['Fog','🌫️','🌫️'],48:['Rime fog','🌫️','🌫️'],51:['Light drizzle','🌦️','🌦️'],53:['Drizzle','🌦️','🌦️'],55:['Heavy drizzle','🌧️','🌧️'],
  61:['Light rain','🌧️','🌧️'],63:['Rain','🌧️','🌧️'],65:['Heavy rain','🌧️','🌧️'],71:['Light snow','🌨️','🌨️'],73:['Snow','❄️','❄️'],75:['Heavy snow','❄️','❄️'],
  80:['Rain showers','🌦️','🌦️'],81:['Rain showers','🌧️','🌧️'],82:['Violent showers','⛈️','⛈️'],95:['Thunderstorm','⛈️','⛈️'],96:['Thunderstorm, hail','⛈️','⛈️'],99:['Thunderstorm, hail','⛈️','⛈️']};
const wmo = (c, day = 1) => { const w = WMO[c] || WMO[Object.keys(WMO).filter(k => k <= c).pop()] || ['Unknown','❔','❔']; return [w[0], day ? w[1] : w[2]]; };
const SKY = { clear:['#2193b0','#6dd5ed'], night:['#0f2027','#2c5364'], cloud:['#485563','#29323c'], rain:['#373b44','#4286f4'], snow:['#7f8c9b','#c9d6e2'], storm:['#232526','#414345'] };

let state = { place: null, data: null, f: false, timer: null };
const fmt = t => Math.round(state.f ? t * 9 / 5 + 32 : t) + '°';
const speed = k => state.f ? Math.round(k * .621) + ' mph' : Math.round(k) + ' km/h';

async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error('Request failed (' + r.status + ')'); return r.json(); }

async function search(name) {
  const g = await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(name));
  if (!g.results) throw new Error('No place found for "' + name + '". Check the spelling.');
  const r = g.results[0];
  return { name: [r.name, r.admin1, r.country].filter(Boolean).join(', '), lat: r.latitude, lon: r.longitude };
}

async function load(place) {
  state.place = place;
  $('msg').hidden = false; $('msg').textContent = 'Loading weather…';
  try {
    const u = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,pressure_msl,weather_code,is_day' +
      '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=7&timezone=auto';
    state.data = await getJSON(u);
    render(); $('msg').hidden = true; $('app').hidden = false;
    clearInterval(state.timer); state.timer = setInterval(() => load(state.place), 10 * 60 * 1000);
  } catch (e) { $('msg').textContent = 'Could not load weather: ' + e.message + '. Check your connection and try again.'; }
}

function render() {
  const d = state.data, c = d.current, [label, icon] = wmo(c.weather_code, c.is_day);
  $('place').textContent = state.place.name;
  $('temp').textContent = fmt(c.temperature_2m);
  $('cond').textContent = icon + ' ' + label;
  $('stats').innerHTML = [['Feels like', fmt(c.apparent_temperature)], ['Humidity', c.relative_humidity_2m + '%'],
    ['Wind', speed(c.wind_speed_10m)], ['Pressure', Math.round(c.pressure_msl) + ' hPa']]
    .map(s => '<div class="stat"><small>' + s[0] + '</small><b>' + s[1] + '</b></div>').join('');

  const now = d.current.time, start = Math.max(0, d.hourly.time.findIndex(t => t >= now.slice(0, 13)));
  $('hours').innerHTML = d.hourly.time.slice(start, start + 24).map((t, i) => {
    const j = start + i;
    return '<div class="hour"><small>' + (i ? new Date(t).toLocaleTimeString([], { hour: 'numeric' }) : 'Now') + '</small><span>' +
      wmo(d.hourly.weather_code[j], d.hourly.is_day[j])[1] + '</span><b>' + fmt(d.hourly.temperature_2m[j]) + '</b><small>' +
      (d.hourly.precipitation_probability[j] ?? 0) + '%</small></div>';
  }).join('');

  $('days').innerHTML = d.daily.time.map((t, i) => {
    const day = i ? new Date(t + 'T12:00').toLocaleDateString([], { weekday: 'long' }) : 'Today';
    return '<div class="day"><span>' + day + ' <small>· ' + (d.daily.precipitation_probability_max[i] ?? 0) + '% rain</small></span><span class="ico" title="' +
      wmo(d.daily.weather_code[i])[0] + '">' + wmo(d.daily.weather_code[i])[1] + '</span><span class="rng"><b>' +
      fmt(d.daily.temperature_2m_max[i]) + '</b> ' + fmt(d.daily.temperature_2m_min[i]) + '</span></div>';
  }).join('');

  $('foot').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · refreshes every 10 minutes · data from Open-Meteo';
  const code = c.weather_code, k = !c.is_day ? 'night' : code >= 95 ? 'storm' : code >= 71 && code <= 77 ? 'snow' :
    (code >= 51 && code <= 67) || (code >= 80 && code <= 82) ? 'rain' : code >= 2 ? 'cloud' : 'clear';
  document.documentElement.style.setProperty('--bg1', SKY[k][0]);
  document.documentElement.style.setProperty('--bg2', SKY[k][1]);
}

$('f').addEventListener('submit', async e => {
  e.preventDefault(); const v = $('q').value.trim(); if (!v) return;
  try { $('msg').hidden = false; $('msg').textContent = 'Searching…'; await load(await search(v)); }
  catch (err) { $('msg').textContent = err.message; }
});
$('loc').addEventListener('click', () => {
  if (!navigator.geolocation) { $('msg').hidden = false; $('msg').textContent = 'This browser does not support location.'; return; }
  navigator.geolocation.getCurrentPosition(
    p => load({ name: 'Your location', lat: p.coords.latitude, lon: p.coords.longitude }),
    () => { $('msg').hidden = false; $('msg').textContent = 'Location access was blocked. Search for a city instead.'; });
});
$('unit').addEventListener('click', () => { state.f = !state.f; $('unit').textContent = state.f ? '°F' : '°C'; if (state.data) render(); });
</script>
</body>
</html>
